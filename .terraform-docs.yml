formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  html: false
  indent: 2
  # Document the version constraint, never whatever happens to be in a local
  # lock file, so the output is the same on every machine and in CI.
  lockfile: false
  required: true
  sensitive: true
  type: true
